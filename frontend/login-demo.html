<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企智通登录演示</title>
    <style>
      :root {
        color: #17233c;
        background: #f7f9fc;
        font-family:
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 0;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        background: #f7f9fc;
      }

      .brand-panel {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(36px, 6vw, 88px);
        overflow: hidden;
        color: #ffffff;
        background:
          radial-gradient(circle at 72% 18%, rgba(35, 211, 255, 0.28), transparent 28%),
          linear-gradient(145deg, #0036bd 0%, #002fa7 44%, #021b63 100%);
      }

      .brand-panel::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.24));
      }

      .brand-frame {
        position: relative;
        z-index: 1;
        width: min(100%, 620px);
        min-height: min(70vh, 760px);
        display: grid;
        align-content: center;
        padding: clamp(30px, 5vw, 54px);
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0)),
          rgba(2, 26, 91, 0.08);
      }

      .brand-frame::after {
        position: absolute;
        right: clamp(18px, 4vw, 46px);
        bottom: clamp(18px, 4vw, 46px);
        width: clamp(130px, 18vw, 230px);
        height: clamp(88px, 12vw, 140px);
        content: "";
        border: 1px solid rgba(115, 221, 255, 0.36);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(115, 221, 255, 0.3) 1px, transparent 1px),
          linear-gradient(rgba(115, 221, 255, 0.24) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      .brand-logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 44px;
        font-size: 28px;
        font-weight: 850;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.46);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        font-size: 25px;
        font-weight: 900;
      }

      .brand-kicker {
        margin: 0 0 14px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 14px;
        font-weight: 850;
      }

      .brand-title {
        max-width: 560px;
        margin: 0;
        font-size: clamp(44px, 6vw, 78px);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .brand-copy {
        max-width: 540px;
        margin: 24px 0 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: 17px;
        line-height: 1.75;
      }

      .signal-strip {
        width: min(100%, 420px);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 34px;
      }

      .signal-strip span {
        min-height: 6px;
        border-radius: 6px;
        background: linear-gradient(90deg, rgba(115, 221, 255, 0.92), rgba(255, 255, 255, 0.2));
      }

      .login-side {
        min-width: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(32px, 6vw, 76px);
      }

      .login-panel {
        width: min(100%, 430px);
      }

      .login-logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #14233d;
        font-size: 18px;
        font-weight: 850;
      }

      .login-logo .brand-mark {
        width: 34px;
        height: 34px;
        color: #002fa7;
        background: #ffffff;
        border-color: #c6d4e7;
        font-size: 18px;
      }

      .login-heading {
        margin: 28px 0 8px;
        color: #0f2345;
        font-size: 36px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .login-subtitle {
        margin: 0;
        color: #60708a;
        font-size: 15px;
        line-height: 1.7;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin: 30px 0 26px;
        padding: 4px;
        border: 1px solid #d8e2ee;
        border-radius: 8px;
        background: #edf3fb;
      }

      .tab-button {
        min-width: 0;
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        color: #526176;
        background: transparent;
        font-size: 14px;
        font-weight: 780;
      }

      .tab-button.active {
        color: #002fa7;
        background: #ffffff;
        box-shadow: 0 0 0 1px rgba(0, 47, 167, 0.12);
      }

      .form-pane {
        display: none;
      }

      .form-pane.active {
        display: block;
      }

      .form-stack {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label {
        color: #233149;
        font-size: 14px;
        font-weight: 780;
      }

      .field input {
        width: 100%;
        min-height: 52px;
        padding: 0 14px;
        border: 1px solid #d6e0ee;
        border-radius: 8px;
        outline: none;
        color: #16233c;
        background: #ffffff;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .field input:focus {
        border-color: #002fa7;
        box-shadow: 0 0 0 3px rgba(0, 47, 167, 0.1);
      }

      .sms-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 132px;
        gap: 10px;
      }

      .primary-button,
      .secondary-button,
      .wechat-button {
        width: 100%;
        min-height: 52px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 850;
      }

      .primary-button {
        border: 0;
        color: #ffffff;
        background: linear-gradient(135deg, #002fa7, #2265e8);
        box-shadow: 0 18px 32px rgba(0, 47, 167, 0.22);
      }

      .primary-button:disabled {
        color: rgba(255, 255, 255, 0.72);
        background: #8da3d7;
        box-shadow: none;
      }

      .secondary-button {
        border: 1px solid #b9cdf0;
        color: #002fa7;
        background: #ffffff;
      }

      .secondary-button:disabled {
        color: #8b98aa;
        background: #eef3fa;
        border-color: #d8e2ee;
      }

      .wechat-button {
        margin-top: 16px;
        border: 1px solid #b8dec6;
        color: #137333;
        background: #f1fbf5;
      }

      .message {
        display: none;
        min-height: 42px;
        align-items: center;
        margin: 18px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 760;
        line-height: 1.5;
      }

      .message.show {
        display: flex;
      }

      .message.error {
        color: #b42318;
        background: #fff0ed;
        border: 1px solid #ffc8c0;
      }

      .message.success {
        color: #116b35;
        background: #edf9f0;
        border: 1px solid #b7e3c3;
      }

      .demo-note {
        margin: 18px 0 0;
        color: #6c7a92;
        font-size: 13px;
        line-height: 1.7;
      }

      @media (max-width: 900px) {
        .app-shell {
          grid-template-columns: minmax(0, 1fr);
        }

        .brand-panel {
          min-height: 340px;
          place-items: end start;
          padding: 32px 24px;
        }

        .brand-frame {
          min-height: auto;
          padding: 28px;
        }

        .brand-logo {
          margin-bottom: 28px;
          font-size: 22px;
        }

        .brand-title {
          font-size: 38px;
        }

        .brand-copy,
        .signal-strip {
          display: none;
        }

        .login-side {
          min-height: auto;
          place-items: start center;
          padding: 34px 20px 46px;
        }
      }

      @media (max-width: 500px) {
        .tabs,
        .sms-row {
          grid-template-columns: minmax(0, 1fr);
        }

        .login-heading {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="brand-panel" aria-label="企智通品牌展示">
        <div class="brand-frame">
          <div class="brand-logo">
            <span class="brand-mark">Q</span>
            <span>企智通</span>
          </div>
          <p class="brand-kicker">QZhipass</p>
          <h1 class="brand-title">企业智能通行入口</h1>
          <p class="brand-copy">连接企业账号与智能工作台，登录后进入企智通系统首页。</p>
          <div class="signal-strip" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>

      <section class="login-side" aria-label="登录区域">
        <div class="login-panel">
          <div class="login-logo">
            <span class="brand-mark">Q</span>
            <span>企智通</span>
          </div>
          <h2 class="login-heading">登录企智通</h2>
          <p class="login-subtitle">使用手机号、邮箱或验证码进入企业智能通行入口。</p>

          <div class="tabs" role="tablist" aria-label="登录方式">
            <button class="tab-button active" type="button" data-tab="phone" role="tab">手机号密码登录</button>
            <button class="tab-button" type="button" data-tab="email" role="tab">邮箱密码登录</button>
            <button class="tab-button" type="button" data-tab="sms" role="tab">验证码登录</button>
          </div>

          <section class="form-pane active" data-pane="phone" aria-label="手机号密码登录">
            <form class="form-stack" id="phoneForm">
              <div class="field">
                <label for="phoneMobile">手机号</label>
                <input id="phoneMobile" name="mobile" type="tel" maxlength="11" autocomplete="username" placeholder="请输入手机号" />
              </div>
              <div class="field">
                <label for="phonePassword">密码</label>
                <input id="phonePassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
              </div>
              <button class="primary-button" id="phoneLoginButton" type="submit" disabled>登录</button>
            </form>
          </section>

          <section class="form-pane" data-pane="email" aria-label="邮箱密码登录">
            <form class="form-stack" id="emailForm">
              <div class="field">
                <label for="emailAccount">邮箱</label>
                <input id="emailAccount" name="email" type="email" autocomplete="username" placeholder="请输入邮箱" />
              </div>
              <div class="field">
                <label for="emailPassword">密码</label>
                <input id="emailPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
              </div>
              <button class="primary-button" id="emailLoginButton" type="submit" disabled>登录</button>
            </form>
          </section>

          <section class="form-pane" data-pane="sms" aria-label="验证码登录">
            <form class="form-stack" id="smsForm">
              <div class="field">
                <label for="smsMobile">手机号</label>
                <input id="smsMobile" name="mobile" type="tel" maxlength="11" autocomplete="tel" placeholder="请输入手机号" />
              </div>
              <div class="field">
                <label for="smsCode">验证码</label>
                <div class="sms-row">
                  <input id="smsCode" name="smsCode" type="text" maxlength="6" inputmode="numeric" placeholder="请输入验证码" />
                  <button class="secondary-button" id="sendSmsButton" type="button" disabled>发送验证码</button>
                </div>
              </div>
              <button class="primary-button" id="smsLoginButton" type="submit" disabled>登录</button>
            </form>
          </section>

          <div class="message" id="messageBox" role="status" aria-live="polite"></div>
          <button class="wechat-button" id="wechatButton" type="button">微信登录</button>
          <p class="demo-note">演示账号：手机号 13800138000，密码 12345@Abc。验证码登录的 mock 验证码为 123456。</p>
        </div>
      </section>
    </main>

    <script>
      const MOCK_MOBILE = "13800138000";
      const MOCK_PASSWORD = "12345@Abc";
      const MOCK_EMAIL = "demo@qzhipass.com";
      const MOCK_CODE = "123456";
      const PASSWORD_PATTERN = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;
      const PASSWORD_REQUIREMENT_MESSAGE = "密码不符合要求：必须至少8位，并包含大写字母、小写字母、数字和特殊字符";

      const tabs = Array.from(document.querySelectorAll(".tab-button"));
      const panes = Array.from(document.querySelectorAll(".form-pane"));
      const messageBox = document.getElementById("messageBox");
      const phoneMobile = document.getElementById("phoneMobile");
      const phonePassword = document.getElementById("phonePassword");
      const phoneLoginButton = document.getElementById("phoneLoginButton");
      const emailAccount = document.getElementById("emailAccount");
      const emailPassword = document.getElementById("emailPassword");
      const emailLoginButton = document.getElementById("emailLoginButton");
      const smsMobile = document.getElementById("smsMobile");
      const smsCode = document.getElementById("smsCode");
      const sendSmsButton = document.getElementById("sendSmsButton");
      const smsLoginButton = document.getElementById("smsLoginButton");

      let countdown = 0;
      let countdownTimer = null;

      function switchTab(tabName) {
        tabs.forEach(tab => {
          const active = tab.dataset.tab === tabName;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });

        panes.forEach(pane => {
          pane.classList.toggle("active", pane.dataset.pane === tabName);
        });

        clearMessage();
      }

      function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = `message show ${type}`;
      }

      function clearMessage() {
        messageBox.textContent = "";
        messageBox.className = "message";
      }

      function updateButtons() {
        phoneLoginButton.disabled = !phoneMobile.value.trim() || !PASSWORD_PATTERN.test(phonePassword.value);
        emailLoginButton.disabled = !emailAccount.value.trim() || !PASSWORD_PATTERN.test(emailPassword.value);
        sendSmsButton.disabled = !smsMobile.value.trim() || countdown > 0;
        smsLoginButton.disabled = !smsMobile.value.trim() || !smsCode.value.trim();
      }

      function validatePassword(password) {
        if (PASSWORD_PATTERN.test(password)) {
          return true;
        }

        showMessage(PASSWORD_REQUIREMENT_MESSAGE, "error");
        return false;
      }

      function handlePasswordInput(password) {
        if (!password || PASSWORD_PATTERN.test(password)) {
          clearMessage();
          return;
        }

        showMessage(PASSWORD_REQUIREMENT_MESSAGE, "error");
      }

      function completeDemoLogin() {
        showMessage("静态登录 demo 已通过。请使用 Vue dev server 的 /index 查看正式首页。", "success");
      }

      tabs.forEach(tab => {
        tab.addEventListener("click", () => switchTab(tab.dataset.tab));
      });

      [phoneMobile, phonePassword, emailAccount, emailPassword, smsMobile, smsCode].forEach(input => {
        input.addEventListener("input", () => {
          if (input === phonePassword || input === emailPassword) {
            handlePasswordInput(input.value);
          } else {
            clearMessage();
          }
          updateButtons();
        });
      });

      document.getElementById("phoneForm").addEventListener("submit", event => {
        event.preventDefault();
        const mobile = phoneMobile.value.trim();
        const password = phonePassword.value;

        if (!validatePassword(password)) {
          return;
        }

        if (mobile !== MOCK_MOBILE) {
          showMessage("用户不存在", "error");
          return;
        }

        if (password !== MOCK_PASSWORD) {
          showMessage("账号或密码错误", "error");
          return;
        }

        completeDemoLogin();
      });

      document.getElementById("emailForm").addEventListener("submit", event => {
        event.preventDefault();

        if (!validatePassword(emailPassword.value)) {
          return;
        }

        if (emailAccount.value.trim() !== MOCK_EMAIL || emailPassword.value !== MOCK_PASSWORD) {
          showMessage("邮箱或密码错误", "error");
          return;
        }

        completeDemoLogin();
      });

      sendSmsButton.addEventListener("click", () => {
        if (!smsMobile.value.trim() || countdown > 0) {
          return;
        }

        countdown = 60;
        sendSmsButton.textContent = `${countdown} 秒后重试`;
        updateButtons();
        clearMessage();

        countdownTimer = window.setInterval(() => {
          countdown -= 1;
          if (countdown <= 0) {
            window.clearInterval(countdownTimer);
            countdownTimer = null;
            sendSmsButton.textContent = "发送验证码";
          } else {
            sendSmsButton.textContent = `${countdown} 秒后重试`;
          }
          updateButtons();
        }, 1000);
      });

      document.getElementById("smsForm").addEventListener("submit", event => {
        event.preventDefault();

        if (smsCode.value.trim() !== MOCK_CODE) {
          showMessage("验证码错误或已过期", "error");
          return;
        }

        completeDemoLogin();
      });

      document.getElementById("wechatButton").addEventListener("click", () => {
        window.alert("微信登录暂未接入，可后续对接后端授权码接口");
      });

      updateButtons();
    </script>
  </body>
</html>
