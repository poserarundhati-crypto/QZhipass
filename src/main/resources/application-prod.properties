# Production profile. Secrets are intentionally required from the environment.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:7510}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

jwt.secret=${JWT_SECRET}

# Fail safely when the production schema does not match the reviewed mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Comma-separated origins, for example: https://qzhipass.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Server-controlled admin allowlist. Leave empty to disable admin access.
app.security.admin-user-ids=${ADMIN_USER_IDS:}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
